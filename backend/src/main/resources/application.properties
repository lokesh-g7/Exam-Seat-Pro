# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ─── JWT Configuration (Environment-Backed) ──────────────────────────────────
jwt.secret=${JWT_SECRET:ExamSeatProSecretKeyForJWTTokenGenerationMustBeLongEnough256Bits!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Database Configuration ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:file:./examseat.db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# ─── JPA / Hibernate (Debug Turned Off for Security) ─────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ─── Production Logging ───────────────────────────────────────────────────────
logging.level.com.examseat=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN

# ─── Upload Limits ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
