<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Coordinate Not Found | ExamSeat Pro</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030712;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      filter: blur(128px);
      opacity: 0.15;
    }
    .orb-1 {
      top: 25%;
      left: -5rem;
      width: 24rem;
      height: 24rem;
      background: #6366f1;
    }
    .orb-2 {
      bottom: 25%;
      right: -5rem;
      width: 24rem;
      height: 24rem;
      background: #9333ea;
    }
    .card {
      position: relative;
      z-index: 10;
      max-width: 32rem;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #818cf8;
      margin-bottom: 1.5rem;
    }
    .pulse-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      background: #f87171;
    }
    .icon-box {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(249, 115, 22, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f87171;
      font-size: 1.75rem;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      border-radius: 0.75rem;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 15px 20px -3px rgba(79, 70, 229, 0.4);
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="pill">
      <span class="pulse-dot"></span>
      SYSTEM CODE: 404_NOT_FOUND
    </div>

    <div class="icon-box">
      ⚠️
    </div>

    <h1>Coordinate Not Found</h1>
    <p>
      The examination hall, seat allocation, or administrative route you requested does not exist or is protected under restricted clearance.
    </p>

    <a href="/" class="btn">
      Return to ExamSeat Pro
    </a>

    <div class="footer">
      ExamSeat Pro Secure Gateway · Protected Session
    </div>
  </div>
</body>
</html>
